name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rspm-linux-x86_64
            binary: target/release/rspm
          - os: macos-latest
            artifact: rspm-macos
            binary: target/release/rspm
          - os: windows-latest
            artifact: rspm-windows-x86_64.exe
            binary: target/release/rspm.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release -p rspm --locked

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
